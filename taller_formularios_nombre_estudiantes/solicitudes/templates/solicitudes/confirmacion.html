<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud Enviada</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg:     #F5F0E6;
            --black:  #0D0D0D;
            --accent: #FF2D55;
            --border: 2.5px solid #0D0D0D;
        }
        body {
            background: var(--bg);
            font-family: 'Space Mono', monospace;
            color: var(--black);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
        }
        nav {
            position: relative; z-index: 2;
            border-bottom: var(--border);
            padding: 18px 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .nav-badge {
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: var(--accent);
            border: var(--border);
            padding: 4px 12px;
            font-weight: 700;
            color: #fff;
        }

        main {
            position: relative; z-index: 1;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 24px;
        }

        .confirm-box {
            border: var(--border);
            background: #FAFAFA;
            box-shadow: 8px 8px 0 var(--black);
            padding: 64px 72px;
            text-align: center;
            max-width: 560px;
            width: 100%;
            animation: slideUp 0.4s cubic-bezier(.16,1,.3,1) both;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .stamp {
            width: 100px;
            height: 100px;
            border: var(--border);
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 36px;
            box-shadow: 4px 4px 0 var(--black);
            animation: pop 0.5s 0.3s cubic-bezier(.16,1,.3,1) both;
        }
        @keyframes pop {
            from { transform: scale(0) rotate(-20deg); opacity: 0; }
            to   { transform: scale(1) rotate(0deg);  opacity: 1; }
        }
        .stamp-icon {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.8rem;
            letter-spacing: 1px;
            color: #fff;
            line-height: 1;
        }

        .confirm-box h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 3.2rem;
            letter-spacing: 2px;
            line-height: 1;
            margin-bottom: 14px;
        }
        .confirm-box p {
            font-size: 0.78rem;
            letter-spacing: 1px;
            line-height: 2;
            opacity: 0.55;
            margin-bottom: 44px;
        }

        .btn-row { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            border: var(--border);
            padding: 14px 28px;
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 4px 4px 0 var(--black);
            transition: transform .12s, box-shadow .12s;
            display: inline-block;
        }
        .btn-primary:hover {
            transform: translate(-2px,-2px);
            box-shadow: 6px 6px 0 var(--black);
            color: #fff;
        }
        .btn-secondary {
            background: transparent;
            color: var(--black);
            border: var(--border);
            padding: 14px 28px;
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 700;
            text-decoration: none;
            transition: background .12s;
            display: inline-block;
        }
        .btn-secondary:hover { background: rgba(13,13,13,0.06); color: var(--black); }
    </style>
</head>
<body>

    <nav>
        <span style="font-size:.7rem;letter-spacing:2px;text-transform:uppercase;opacity:.4;">02 — Solicitudes</span>
        <span class="nav-badge">✓ Enviado</span>
    </nav>

    <main>
        <div class="confirm-box">
            <div class="stamp">
                <span class="stamp-icon">OK</span>
            </div>
            <h1>Solicitud<br>Enviada</h1>
            <p>Tu solicitud fue registrada correctamente<br>en el sistema PostgreSQL.</p>
            <div class="btn-row">
                <a href="{% url 'solicitud_registro' %}" class="btn-primary">+ Nueva solicitud</a>
                <a href="/" class="btn-secondary">← Inicio</a>
            </div>
        </div>
    </main>

</body>
</html>
